[workspace]
members = [
  "crates/smwapt-core",
  "crates/smwapt-cli",
  "crates/smwapt-server",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://example.invalid/smwapt"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
bytes = "1.6"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
fs_extra = "1.3"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
tar = "0.4"
tempfile = "3.10"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["fs", "trace"] }
url = "2.5"
walkdir = "2.5"
zip = "2.1"
